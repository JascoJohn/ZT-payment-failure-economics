# Every analytical threshold and assumption used by the pipeline.
# Change a value here and rerun `python run_all.py` to see its effect on every output.

data:
  workbook: data/raw/ZT_EA_Regional_Data.xlsx
  currency_aliases: {GHC: GHS, ZMK: ZMW, "XAF/CFA": XAF, CFA: XAF}
  country_aliases: {"Tanzania, United Republic Of": Tanzania}
  sector_aliases: {ecommerce: eCommerce}

fx:
  # Sierra Leone redenominated on 1 July 2022 (1 SLE = 1,000 SLL). The supplied SLL rate series
  # switches to new-leone scale while transactions stay at old-leone amounts.
  redenomination_fixes:
    - {currency: SLL, rate_above: 0.001, divide_by: 1000}
  spike_ratio: 5            # drop daily rates more than 5x away from their currency-month median
  constant_currency_year: 2022
  volatility_screen: 0.10   # analytical screen, not an IAS 21 rule

flags:
  fee_ratio_low: 0.005
  fee_ratio_high: 0.20
  value_per_attempt_limit: 10000   # USD, ~99.9th percentile

anomalies:
  relative: {min_failed: 1000, multiple_of_prior_median: 50, max_success_rate: 0.05, lookback_months: 6}
  escalation: {min_failed: 5000, max_success_rate: 0.05}   # absolute trigger, applied to non-anomalous observations
  sensitivity:
    loose: {min_failed: 500, multiple_of_prior_median: 25, max_success_rate: 0.10}
    strict: {min_failed: 2000, multiple_of_prior_median: 100, max_success_rate: 0.02}

customers:
  elevated_rate: 0.75
  persistent_share_of_months: 0.5
  min_active_months: 6
  lapse_window_start: "2024-02-01"
  tenure_bands: [-1, 3, 12, 24, 10000]

patterns:
  min_month_attempts: 500
  min_eligible_months: 12
  high_confidence_months: 18
  structural_median: 0.70
  deteriorating_pp: 0.10
  unstable_sd: 0.15

january:
  baseline_start: "2023-07-01"
  baseline_end: "2023-12-01"
  target: "2024-01-01"

recovery:
  optimistic_margin: 0.10
  best_window_months: 3
  best_window_min_attempts: 500
  min_successes_for_local_fee: 100
  cost_ratios: [0, 0.2, 0.4, 0.6, 1.0]
  bootstrap: {replicates: 5000, seed: 2026, interval: 0.90}   # customer-resampling interval for the base case
